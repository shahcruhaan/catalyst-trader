# ============================================================
# AI Catalyst Momentum Breakout Paper Trader
# AGGRESSIVE CONFIG — Maximum Profitability Version
# ============================================================

# --- Portfolio Settings ---
portfolio:
  starting_cash: 100000
  max_positions: 6              # concentrated — each winner matters
  target_position_size: 0.20   # 20% per trade
  max_position_size: 0.30      # allow growth to 30% for big winners
  transaction_cost_bps: 5
  slippage_bps: 15             # slightly higher — aggressive entries gap more

# --- Universe Quality Filters ---
filters:
  min_price: 7                 # raised from 5 — sub-$7 stocks are manipulable
  min_market_cap: 750000000    # $750M — lets in aggressive growth names
  min_avg_dollar_volume: 35000000  # $35M — liquid enough to exit fast
  min_avg_share_volume: 750000
  min_volume_ratio: 2.5        # only real institutional volume surges
  min_20d_return: 0.10         # must have real momentum — not just noise
  min_relative_strength_20d: 0.08  # must genuinely beat the market
  min_catalyst_score: 8        # do not lower this — it is your edge

# --- Technical Indicator Settings ---
indicators:
  breakout_lookback: 15        # 15-day breakout catches moves earlier
  trend_ma: 30                 # 30-day MA responds faster than 50-day
  exit_ma_fast: 10
  exit_ma_slow: 20
  relative_strength_lookback: 20

# --- Exit / Stop Loss Rules ---
exits:
  stop_loss_pct: 0.07          # tight — cut losers fast
  breakeven_trigger_pct: 0.15  # move stop to breakeven after 15% gain
  partial_take_profit_trigger_pct: 0.40  # take 1/3 off at 40%
  big_winner_trigger_pct: 0.65 # trail big winners from 65%
  max_holding_days: 35         # give momentum time to develop
  stall_days: 7                # don't panic on brief consolidation
  rs_weakness_days: 7          # same — filter noise from real weakness

# --- Broker Settings ---
broker:
  provider: alpaca
  paper_only: true             # never change this
  allow_live_trading: false    # never change this
  allow_shorting: false
  allow_margin: false
  allow_options_trading: false
  use_market_orders: true
  max_orders_per_day: 12       # 6 entries + 6 potential exits in one day
  require_approved_universe: false
  require_discovered_universe: true

# --- Order Execution Settings ---
execution:
  buy_timing: next_market_open
  sell_timing: next_market_open
  duplicate_order_protection: true
  cancel_stale_open_orders: true
  stale_order_minutes: 60
  order_log_path: reports/orders_log.csv
  signal_file_path: reports/paper_signals.csv
  state_file_path: reports/paper_state.json

# --- Universe Discovery Settings ---
universe_discovery:
  enabled: true
  use_fixed_universe_fallback: true
  max_discovered_symbols: 400  # wider net than 300, manageable scan time
  min_price: 7
  min_market_cap: 750000000
  min_avg_dollar_volume: 35000000
  min_avg_share_volume: 750000
  exclude_otc: true
  exclude_warrants_units_preferreds: true
  blocked_symbols_path: data/blocked_symbols.csv
  discovered_universe_path: reports/daily_discovered_universe.csv

# --- Which Discovery Sources to Use ---
discovery_sources:
  alpaca_most_active_by_volume: true
  alpaca_most_active_by_trades: true
  top_gainers: true
  yfinance_volume_spike_scan: true
  yfinance_breakout_scan: true
  news_discovery: false
  polygon_provider_enabled: false

# --- Catalyst Scoring Settings ---
catalysts:
  require_catalyst_for_trade: true
  manual_catalyst_path: data/catalyst_overrides.csv
  needs_review_path: reports/needs_catalyst_review.csv
  allow_price_only_trades: false
  min_catalyst_score: 8        # non-negotiable floor

# --- Scheduler Settings ---
scheduler:
  enabled: true
  timezone: America/New_York
  scan_time: "16:15"
  execute_time: "09:32"
  reconcile_time: "09:45"
  intraday_exit_check_time: "15:45"
  report_time: "16:10"
  prevent_duplicate_daily_runs: true
  scheduler_log_path: reports/scheduler_log.csv

# --- Options Overlay ---
options_overlay:
  enabled: true
  max_recommendations: 3
  target_dte: 75
  long_call_itm_pct: 0.07
  short_call_otm_pct: 0.20

# --- News Discovery ---
news:
  enabled: true
  primary_provider: alpaca
  fallback_provider: yahoo
  days_back: 5                 # fresher catalysts only
  max_headlines_per_symbol: 12 # more data for scorer
  news_cache_path: reports/news_cache.csv
  require_recent_news: true
  max_news_age_days: 5         # catalyst must be fresh
  deduplicate: true

# --- Catalyst Scoring ---
catalyst_scoring:
  mode: heuristic
  use_manual_overrides: true
  use_llm_if_available: true   # keep on — critical for borderline cases
  min_score_to_trade: 8        # do not lower
  require_medium_or_high_confidence: true
  reject_negative_flags: true
  reject_hype_only: true
  output_path: reports/automated_catalyst_scores.csv
  auto_catalyst_scores_path: reports/automated_catalyst_scores.csv

# --- Alpha Filters ---
alpha_filters:
  earnings_avoidance_days: 3   # avoid binary event, allow post-earnings entries
  sector_max_positions: 1      # never double up in same sector
  max_extension_pct: 0.55      # don't chase stocks >55% above 20d MA
  gap_up_max_pct: 0.08         # don't buy after >8% overnight gap
  atr_stop_multiplier: 1.5
  atr_max_stop_pct: 0.12
  max_pct_below_52w_high: 0.20 # only stocks near highs — less overhead supply
  require_multi_day_volume: true  # confirm institutional accumulation
  max_daily_entries: 3         # fewer, higher conviction entries only
  min_adx: 22                  # confirmed trend, not noise
  max_pre_breakout_range_pct: 0.50  # fixed: 0.12 was too tight for momentum stocks
  require_sector_etf_uptrend: true  # only trade in healthy sectors

# --- Automation Control ---
automation:
  fully_automated: true
  require_human_review_before_orders: false
  pause_on_low_confidence_catalysts: true
  pause_on_news_provider_failure: false
  max_automated_trades_per_day: 3
  max_symbols_to_score_per_day: 400
  max_drawdown_pct: 0.15       # pause at 15% drawdown — protect capital
  automation_state_path: reports/automation_state.json
  alerts_log_path: reports/alerts_log.csv
  order_approval_path: reports/order_approval.csv
